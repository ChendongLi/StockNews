# stocks.yaml — Stock watchlist configuration
# To add a stock: append an entry below, commit, and push.
# Cloud Build will redeploy automatically — no code changes needed.
#
# Fields:
#   ticker:   Exchange symbol (e.g. AAPL, 2330.TW, ASML.AS, 005930.KS)
#   name:     Display name
#   section:  "Big Mega" | "Semiconductor" | "SaaS Software"
#   currency: ISO currency code (USD, TWD, EUR, KRW, ...)
#   color:    Hex color for badge and accent

