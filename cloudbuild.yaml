steps:
  # Build image with commit SHA and latest tags
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'us-west1-docker.pkg.dev/agentlens-489006/voicebuddy/stocknews:$COMMIT_SHA'
      - '-t'
      - 'us-west1-docker.pkg.dev/agentlens-489006/voicebuddy/stocknews:latest'
      - '.'

  # Push all tags
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'us-west1-docker.pkg.dev/agentlens-489006/voicebuddy/stocknews'

  # Deploy morning job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        sed 's/COMMIT_SHA/$COMMIT_SHA/g' infra/job-morning.yaml | \
        gcloud run jobs replace - --region=us-west1 --project=agentlens-489006

  # Deploy noon job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        sed 's/COMMIT_SHA/$COMMIT_SHA/g' infra/job-noon.yaml | \
        gcloud run jobs replace - --region=us-west1 --project=agentlens-489006

options:
  logging: CLOUD_LOGGING_ONLY
